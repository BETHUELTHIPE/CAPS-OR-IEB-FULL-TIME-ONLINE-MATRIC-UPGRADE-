services:
  amaris-math-hub:
    image: bethuelm/amaris-mathematics-deploy-v1:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amaris-mathematics-hub
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
