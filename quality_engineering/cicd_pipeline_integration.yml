name: "AMH Performance Engineering & Load Validation Pipeline"

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-analysis:
    name: "Code Lint & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Build Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Development Dependencies
        run: npm ci

      - name: Run Linter Checks
        run: npm run lint

  api-performance-benchmarks:
    name: "API Load Testing & SLA Audit (k6)"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Boot Simulated Express / Django Backend
        run: |
          npm ci
          npm run build
          # Start server in background to serve API endpoints
          NODE_ENV=production npm run start &
          echo "Waiting 5 seconds for application to bind to port 3000..."
          sleep 5

      - name: Install Grafana k6 Load Engine
        run: |
          curl -s https://dl.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.get_sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Execute API Load Simulation & Assert SLAs
        run: |
          echo "Running performance validation against localhost:3000..."
          k6 run quality_engineering/k6/load_test_api.js --out json=quality_engineering/reports/k6_metrics.json

      - name: Archive Test Metrics Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: quality_engineering/reports/

  user-behavior-simulation:
    name: "User Workload Emulation (Locust)"
    needs: api-performance-benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Locust Load Engine & Dependencies
        run: pip install locust

      - name: Start Background Application Server
        run: |
          npm ci
          npm run build
          NODE_ENV=production npm run start &
          sleep 5

      - name: Run Locust Headless Behavior Emulation
        run: |
          echo "Emulating active student traffic profiles..."
          locust -f quality_engineering/locust/user_behavior_simulation.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 45s \
            --host http://localhost:3000 \
            --html quality_engineering/reports/locust_summary.html

      - name: Archive Locust Telemetry Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-behavior-report
          path: quality_engineering/reports/
